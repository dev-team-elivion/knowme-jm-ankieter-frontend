csrf-token:
  get:
    tags:
      - Csrf
    summary: Token CSRF biezacej sesji
    description: >-
      Token jest stabilny w obrebie sesji (HttpSessionCsrfTokenRepository), wiec front pobiera go raz
      i dokleja do zadan zmieniajacych stan.
    operationId: getCsrfToken
    responses:
      200:
        description: Token CSRF
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrfToken'
components:
  schemas:
    CsrfToken:
      type: object
      required:
        - headerName
        - parameterName
        - token
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
        token:
          type: string
