csrf-token:
  get:
    tags:
      - Csrf
    summary: CSRF token of the current session
    description: >-
      The token is stable within a session (HttpSessionCsrfTokenRepository), so the frontend
      fetches it once and attaches it to every state-changing request.
    operationId: getCsrfToken
    responses:
      200:
        description: The CSRF token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrfToken'
components:
  schemas:
    CsrfToken:
      type: object
      required:
        - headerName
        - parameterName
        - token
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        parameterName:
          type: string
          example: _csrf
        token:
          type: string
