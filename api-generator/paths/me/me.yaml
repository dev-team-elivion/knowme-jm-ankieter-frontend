current-user:
  get:
    tags:
      - CurrentUser
    summary: Details of the signed-in user
    description: Requires an SSO session. The data comes from the Keycloak token.
    operationId: getCurrentUser
    responses:
      200:
        description: User details from the current session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentUser'
      401:
        description: No signed-in session
components:
  schemas:
    CurrentUser:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
