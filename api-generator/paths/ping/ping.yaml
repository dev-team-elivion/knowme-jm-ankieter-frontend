ping:
  get:
    tags:
      - Ping
    summary: Public application health check
    description: Unauthenticated endpoint the frontend uses to check whether the backend responds.
    operationId: ping
    responses:
      200:
        description: The backend responds
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingResponse'
components:
  schemas:
    PingResponse:
      type: object
      required:
        - application
        - status
        - serverTime
      properties:
        application:
          type: string
          example: knowme-jm-ankieter-backend
        status:
          $ref: '#/components/schemas/PingStatus'
        serverTime:
          type: string
          format: date-time
    PingStatus:
      type: string
      enum:
        - UP
