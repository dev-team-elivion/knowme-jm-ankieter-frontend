# Category and tag dictionaries.
#
# A category is a hard entity: tests draw by category, so it has to stay disjoint and stable.
# Its code prefix is what question keys are built from, which is why the prefix is fixed once a
# key has been issued.
#
# A tag is free-form and only helps finding questions. Authors add tags while writing, so the
# dictionary grows on its own — hence the search parameter for suggestions while typing, and
# merging for the duplicates that appear anyway.

categories:
  get:
    tags: [Dictionaries]
    summary: List categories
    operationId: listCategories
    parameters:
      - name: activeOnly
        in: query
        schema: { type: boolean, default: false }
    responses:
      200:
        description: Categories, in display order
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Category' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }

  post:
    tags: [Dictionaries]
    summary: Create a category
    operationId: createCategory
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CategoryRequest' }
    responses:
      201:
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      400: { $ref: '../common/errors.yaml#/components/responses/BadRequest' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }
      409: { $ref: '../common/errors.yaml#/components/responses/Conflict' }

category-by-id:
  patch:
    tags: [Dictionaries]
    summary: Rename a category, reorder it or take it out of use
    description: >-
      The code prefix can only change while the category has no questions — it is already baked
      into the keys that were issued. Categories are never deleted, only deactivated: deleting
      one would strip the classification from historical questions and break reports.
    operationId: updateCategory
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CategoryRequest' }
    responses:
      200:
        description: Updated
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Category' }
      400: { $ref: '../common/errors.yaml#/components/responses/BadRequest' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }
      404: { $ref: '../common/errors.yaml#/components/responses/NotFound' }
      409: { $ref: '../common/errors.yaml#/components/responses/Conflict' }

tags:
  get:
    tags: [Dictionaries]
    summary: List tags
    description: >-
      With "q" it serves suggestions while an author types. Suggestions are what actually
      prevents duplicates; merging only cleans up after them.
    operationId: listTags
    parameters:
      - { name: q, in: query, schema: { type: string } }
      - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
    responses:
      200:
        description: Tags with their usage counts
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Tag' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }

  post:
    tags: [Dictionaries]
    summary: Create a tag
    operationId: createTag
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TagRequest' }
    responses:
      201:
        description: Created
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tag' }
      400: { $ref: '../common/errors.yaml#/components/responses/BadRequest' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }
      409: { $ref: '../common/errors.yaml#/components/responses/Conflict' }

tag-merge:
  post:
    tags: [Dictionaries]
    summary: Merge one tag into another
    description: >-
      Moves every question from the source tag to the target and deactivates the source. For the
      "bhp" / "BHP" / "b.h.p." that appear after a few months of everyone tagging as they go.
    operationId: mergeTags
    parameters:
      - { name: tagId, in: path, required: true, description: The tag being merged away, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MergeTagRequest' }
    responses:
      200:
        description: The surviving tag, with its usage count updated
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tag' }
      400: { $ref: '../common/errors.yaml#/components/responses/BadRequest' }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }
      404: { $ref: '../common/errors.yaml#/components/responses/NotFound' }

procedure-names:
  get:
    tags: [Dictionaries]
    summary: Procedure names already used in the bank
    description: >-
      Not a dictionary, just suggestions while typing. The point is that the same procedure is
      spelled the same way twice, so a review after it changes finds every question.
    operationId: listProcedureNames
    parameters:
      - { name: q, in: query, schema: { type: string } }
    responses:
      200:
        description: Names, most used first
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      401: { $ref: '../common/errors.yaml#/components/responses/Unauthorized' }

components:
  schemas:

    Category:
      type: object
      required: [id, codePrefix, name, displayOrder, active, questionCount]
      properties:
        id: { type: string, format: uuid }
        codePrefix: { type: string, example: BHP }
        name: { type: string, example: BHP }
        displayOrder: { type: integer, format: int32 }
        active: { type: boolean }
        questionCount:
          type: integer
          format: int64
          description: >-
            How many questions use it. The interface needs this to say what deactivating would
            affect, and to know when the prefix is still editable.

    CategoryRequest:
      type: object
      required: [codePrefix, name]
      properties:
        codePrefix: { type: string, minLength: 1, maxLength: 16, example: BHP }
        name: { type: string, minLength: 1, maxLength: 120 }
        displayOrder: { type: integer, format: int32, default: 0 }
        active: { type: boolean, default: true }

    Tag:
      type: object
      required: [id, code, label, active, questionCount]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: Normalised form used for matching, so case and spacing do not create twins.
          example: bhp
        label: { type: string, example: BHP }
        active: { type: boolean }
        questionCount: { type: integer, format: int64 }

    TagRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean, default: true }

    MergeTagRequest:
      type: object
      required: [targetTagId]
      properties:
        targetTagId:
          type: string
          format: uuid
          description: The tag that survives. Must differ from the one in the path.
